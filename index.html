<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Sheet</title>
  <meta name="description" content="A small spreadsheet in the browser: its own formula engine, dependency-ordered recalculation, undo/redo and CSV import/export.">
  <meta name="theme-color" content="#0f172a">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Mini Sheet">
  <meta property="og:description" content="A small spreadsheet in the browser with its own formula engine, undo/redo and CSV import/export.">
  <meta property="og:url" content="https://celaldrg.github.io/mini-sheet/">
  <meta property="og:image" content="https://celaldrg.github.io/mini-sheet/docs/screenshot.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f172a'/%3E%3Crect x='5' y='5' width='22' height='22' rx='3' fill='none' stroke='%2334d399' stroke-width='2'/%3E%3Cpath d='M5 13h22M5 20h22M13 5v22' stroke='%2334d399' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="5"/><path d="M3 12h26M3 20h26M12 3v26"/></svg>
        <span data-i18n="appTitle">Mini Sheet</span>
      </h1>
      <div class="top-actions">
        <button id="btn-new" class="btn" type="button" data-i18n="newSheet" data-i18n-title="newSheetTitle">New</button>
        <button id="btn-lang" class="btn lang" type="button" data-i18n="langToggle" data-i18n-title="langToggleTitle">TR</button>
      </div>
    </header>

    <div class="toolbar" role="toolbar">
      <div class="group">
        <button id="btn-undo" class="btn icon" type="button" data-i18n-aria="undo" data-i18n-title="undoTitle">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
        </button>
        <button id="btn-redo" class="btn icon" type="button" data-i18n-aria="redo" data-i18n-title="redoTitle">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
        </button>
      </div>
      <div class="group formats">
        <button class="btn fmt" type="button" data-format="general" data-i18n="formatGeneral" data-i18n-title="formatGeneralTitle">General</button>
        <button class="btn fmt" type="button" data-format="fixed2" data-i18n="formatFixed2" data-i18n-title="formatFixed2Title">0.00</button>
        <button class="btn fmt" type="button" data-format="percent" data-i18n="formatPercent" data-i18n-title="formatPercentTitle">%</button>
        <button class="btn fmt" type="button" data-format="thousands" data-i18n="formatThousands" data-i18n-title="formatThousandsTitle">1,000</button>
      </div>
      <div class="group">
        <button id="btn-examples" class="btn" type="button" aria-haspopup="menu"><span data-i18n="examples">Examples</span><span class="caret" aria-hidden="true">▾</span></button>
        <button id="btn-csv" class="btn" type="button" aria-haspopup="menu"><span data-i18n="csv">CSV</span><span class="caret" aria-hidden="true">▾</span></button>
        <button id="btn-more" class="btn icon" type="button" aria-haspopup="menu" data-i18n-aria="more" data-i18n-title="moreTitle">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
        </button>
      </div>
    </div>

    <div class="formula-bar">
      <output id="addr" class="addr" data-i18n-aria="cellAddress">A1</output>
      <span class="fx" aria-hidden="true">fx</span>
      <input id="bar-input" class="bar-input" type="text" autocomplete="off" spellcheck="false" data-i18n-aria="formulaInput" data-i18n-placeholder="formulaPlaceholder">
    </div>

    <div id="grid-wrap" class="grid-wrap" tabindex="0" role="region"></div>

    <div class="statusbar" role="status" aria-live="polite">
      <span id="status-msg" class="status-msg"></span>
      <span id="status-stats" class="status-stats"></span>
    </div>

    <footer class="footer">
      <span data-i18n="footerLicense">MIT</span> · <a href="https://github.com/celaldrg/mini-sheet" data-i18n="footerSource">Source on GitHub</a>
    </footer>
  </div>

  <div id="menu" class="menu"></div>

  <dialog id="csv-dialog" class="dialog">
    <form method="dialog">
      <h2 data-i18n="csvDialogTitle">Paste CSV text</h2>
      <p class="muted" data-i18n="csvDialogHint">The sheet is replaced. You can undo it.</p>
      <textarea id="csv-text" rows="8" spellcheck="false" data-i18n-aria="csvDialogTitle"></textarea>
      <div class="dialog-actions">
        <button class="btn" type="submit" value="cancel" data-i18n="cancel">Cancel</button>
        <button class="btn primary" type="submit" value="import" data-i18n="import">Import</button>
      </div>
    </form>
  </dialog>

  <input id="file-input" type="file" accept=".csv,text/csv,text/plain" hidden>
  <script type="module" src="src/main.js"></script>
</body>
</html>
